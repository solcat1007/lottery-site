<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的老师们</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(ellipse at 30% 20%, #1b1b2a 0%, #0a0a12 50%, #000 100%);
  }
  .stage { position: relative; width: 100vw; height: 100vh; }
  .slide {
    position: absolute; inset: 0;
    opacity: 0; transform: scale(1.04);
    transition: opacity 1.2s ease-in-out, transform 6s linear;
    display: flex; align-items: center; justify-content: center;
    padding: 2vh 2vw;
  }
  .slide.active {
    opacity: 1; transform: scale(1.0);
  }
  .slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow:
      0 20px 80px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.06);
  }
  .indicator {
    position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
    padding: 10px 18px; border-radius: 999px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: all 0.3s ease;
  }
  .dot.active { background: #fff; width: 30px; border-radius: 999px; }
  .counter {
    position: fixed; top: 2.5vh; right: 2.5vw; z-index: 10;
    color: rgba(255,255,255,0.7); font-size: 14px;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(8px);
    padding: 8px 14px; border-radius: 8px;
    letter-spacing: 1px;
  }
  @media (max-width: 600px) {
    .counter { font-size: 12px; }
    .slide { padding: 1vh 1vw; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="slide"><img src="1.jpg" alt="照片1" loading="eager"></div>
    <div class="slide"><img src="2.jpg" alt="照片2" loading="eager"></div>
    <div class="slide"><img src="3.jpg" alt="照片3" loading="eager"></div>
  </div>
  <div class="counter" id="counter">1 / 3</div>
  <div class="indicator" id="indicator">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

<script>
(function(){
  const slides = document.querySelectorAll('.slide');
  const dots   = document.querySelectorAll('.dot');
  const counter = document.getElementById('counter');
  const N = slides.length;
  let cur = 0;
  const INTERVAL_MS = 4500;

  function show(i){
    slides.forEach((s,k) => s.classList.toggle('active', k === i));
    dots.forEach((d,k)   => d.classList.toggle('active', k === i));
    counter.textContent = `${i+1} / ${N}`;
    cur = i;
  }
  function next(){
    show((cur + 1) % N);
  }
  function prev(){
    show((cur - 1 + N) % N);
  }
  show(0);
  setInterval(next, INTERVAL_MS);

  // 点击/触摸切换
  document.addEventListener('click', (e)=>{
    const w = window.innerWidth;
    if (e.clientX < w * 0.35) prev();
    else next();
  });
  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });
})();
</script>
</body>
</html>
